name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets to Android
        run: ./node_modules/.bin/cap copy android

      - name: Sync Capacitor
        run: ./node_modules/.bin/cap sync android

      - name: Generate app icons and splash screens with @capacitor/assets
        run: |
          npm install -D @capacitor/assets
          mkdir -p assets
          cp public/logo/logo.jpeg assets/logo.png
          cp public/logo/logo.jpeg assets/splash.png
          npx capacitor-assets generate --android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoReEngine-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
